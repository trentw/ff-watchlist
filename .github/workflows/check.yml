name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run python scripts/check.py
      - run: npm run build
