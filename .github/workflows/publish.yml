name: Publish

# Collects the current week and deploys the site. If collection or validation
# fails nothing is deployed, so the last good bundle stays live.
on:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm run build
      # Set the repository variable SHOW_HEADSHOTS or SHOW_LOGOS to "false"
      # to publish a bundle that tells the app not to load those images.
      - name: Export data
        run: >
          uv run ff-watchlist export
          ${{ vars.SHOW_HEADSHOTS == 'false' && '--no-headshots' || '' }}
          ${{ vars.SHOW_LOGOS == 'false' && '--no-logos' || '' }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
